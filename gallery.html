<!DOCTYPE html> 
 <html lang="en"> 
 <head> 
   <meta charset="UTF-8"> 
   <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
   <title>JNEC Events Hub — Gallery</title> 
   <link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
rel="stylesheet"> 
   <link rel="stylesheet" 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"> 
   <link rel="stylesheet" href="css/styles.css"> 
 </head> 
 <body> 
   <header id="top"> 
  <h1>JNEC Events Hub</h1> 
  <button type="button" id="darkToggle" class="btn btn-sm btn-outline-light">Dark 
mode</button> 
  <nav> 
    <a href="index.html">Home</a> 
    <a href="events.html">Events</a> 
    <a href="register.html">Register</a> 
    <a href="gallery.html">Gallery</a> 
    <a href="contact.html">Contact</a> 
  </nav> 
   </header> 
   <main> 
  <div class="container py-4"> 
    <h2>Event Gallery</h2> 
    <img src="media/hackathon.jpg" alt="Students at last year's hackathon" 
width="300"> 
    <img src="media/losar.jpg" alt="Losar celebration" width="300"> 
    <img src="media/football.jpg" alt="Inter-college football final" width="300"> 
 
    <h2>Highlights Video</h2> 
    <video controls width="480" poster="media/hackathon.jpg"> 
      	<source src="media/highlights.mp4" type="video/mp4"> 
      	Sorry, your browser does not support the video element. 
    </video> 
 
    <h2>Campus Radio Jingle</h2> 
    <audio controls> 
      	<source src="media/jingle.mp3" type="audio/mpeg"> 
      	Sorry, your browser does not support the audio element. 
    </audio> 
  </div> 
   </main>
   <!-- ===== IMAGE MODALS (Popup on Click) ===== -->

    <!-- Modal 1 -->
    <div class="modal fade" id="imageModal1" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content bg-transparent border-0">
                <div class="modal-body text-center">
                    <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" style="z-index: 1050;"></button>
                    <img src="media/hackathon.jpg" class="img-fluid rounded shadow-lg" style="max-height: 80vh; width: auto;" alt="Hackathon">
                    <p class="text-white mt-3 fw-bold fs-4">Hackathon 2025</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal 2 -->
    <div class="modal fade" id="imageModal2" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content bg-transparent border-0">
                <div class="modal-body text-center">
                    <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" style="z-index: 1050;"></button>
                    <img src="media/losar.jpg" class="img-fluid rounded shadow-lg" style="max-height: 80vh; width: auto;" alt="Losar Festival">
                    <p class="text-white mt-3 fw-bold fs-4">Losar Festival</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal 3 -->
    <div class="modal fade" id="imageModal3" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content bg-transparent border-0">
                <div class="modal-body text-center">
                    <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" style="z-index: 1050;"></button>
                    <img src="media/football.jpg" class="img-fluid rounded shadow-lg" style="max-height: 80vh; width: auto;" alt="Football">
                    <p class="text-white mt-3 fw-bold fs-4">Football Final</p>
                </div>
            </div>
        </div>
    </div> 
   <footer> 
  <p>&copy; <span id="year"></span> JNEC Events Hub</p> 
   </footer> 
   <script 
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script> 
   <script src="js/main.js"></script> 
 </body> 
 </html>
